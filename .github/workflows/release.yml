name: Release

# Pushing a tag vX.Y.Z (see RELEASE.md) builds the release ZIP reproducibly, checks that the tag matches the
# plugin version, and publishes the ZIP and its SHA-256 as a GitHub release (draft – reviewed before publishing).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, xml, zip
          coverage: none
      - name: Tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' voucher-captain.php | tr -d '[:space:]')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}"; exit 1; }
          grep -q "^= ${version} =" readme.txt || { echo "readme.txt has no changelog section for ${version}"; exit 1; }
      - name: Build twice and compare
        run: |
          bin/build.sh
          cp build/voucher-captain.zip.sha256 /tmp/first.sha256
          bin/build.sh
          diff /tmp/first.sha256 build/voucher-captain.zip.sha256
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="= ${version} =" '$0==v{f=1;next} /^= /{f=0} f' readme.txt > build/notes.md
          gh release create "${GITHUB_REF_NAME}" build/voucher-captain.zip build/voucher-captain.zip.sha256 \
            --draft --title "Voucher Captain ${version}" --notes-file build/notes.md
