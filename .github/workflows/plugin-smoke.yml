name: Plugin smoke tests

on:
  push:
    branches:
      - main
      - claude/youthful-bardeen-7ejd7a
      - codex/fix-voucher-audit-findings
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring, xml, zip
          coverage: none
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP files
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run plugin smoke tests
        run: php tests/run.php
