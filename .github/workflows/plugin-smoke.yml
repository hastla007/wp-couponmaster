name: Plugin smoke tests

on:
  push:
    branches:
      - main
      - claude/youthful-bardeen-7ejd7a
      - codex/fix-voucher-audit-findings
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring, xml, zip
          coverage: none
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Lint PHP files
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run plugin smoke tests
        run: php tests/run.php
      - name: Translation template, email texts and legal text template are up to date
        run: |
          php bin/make-pot.php
          git diff --exit-code -I 'POT-Creation-Date' -I '^#: ' -- languages/voucher-captain.pot
          php bin/email-texts.php --check
          php bin/legal-texts.php --check
      - name: Release ZIP is reproducible (two builds, same SHA-256)
        if: matrix.php == '8.4'
        run: |
          bin/build.sh
          cp build/voucher-captain.zip.sha256 /tmp/first.sha256
          bin/build.sh
          diff /tmp/first.sha256 build/voucher-captain.zip.sha256

  wordpress-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping --host=127.0.0.1 --user=root --password=root
          - name: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: healthcheck.sh --connect --innodb_initialized
        order_storage:
          - name: HPOS
            enabled: 'yes'
            expected: 'yes'
          - name: Legacy posts
            enabled: 'no'
            expected: 'no'
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress 7.1.4
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain CI" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
      - name: Build, install, and update the release ZIP
        run: |
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test plugin install wordpress-seo --version=28.8 --activate
          php wp-cli.phar --path=wp-test option update woocommerce_custom_orders_table_enabled ${{ matrix.order_storage.enabled }}
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --force
      - name: Run WooCommerce lifecycle and database integration checks
        env:
          VCAP_EXPECT_HPOS: ${{ matrix.order_storage.expected }}
        run: |
          VCAP_WITH_COMPAT=1 tests/run-integration.sh
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" setup
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" reserve 0 & first=$!
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" reserve 1 & second=$!
          wait "$first"
          wait "$second"
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" verify
      - name: Verify uninstall preserves data by default and deletes only when opted in
        run: |
          php wp-cli.phar --path=wp-test option update vcap_delete_on_uninstall no
          php wp-cli.phar --path=wp-test plugin deactivate voucher-captain
          php wp-cli.phar --path=wp-test plugin uninstall voucher-captain
          php wp-cli.phar --path=wp-test eval 'global $wpdb; if (!$wpdb->get_var("SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"")) { exit(1); }'
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test option update vcap_delete_on_uninstall yes
          php wp-cli.phar --path=wp-test plugin deactivate voucher-captain
          php wp-cli.phar --path=wp-test plugin uninstall voucher-captain
          php wp-cli.phar --path=wp-test eval 'global $wpdb; if ($wpdb->get_var("SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"")) { exit(1); }'

  minimum-versions:
    # Oldest supported platform (plugin header) without Yoast SEO: WordPress 6.4, WooCommerce 8.9, PHP 8.1.
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress 6.4, WooCommerce 8.9 and the release ZIP (no Yoast SEO)
        run: |
          php wp-cli.phar core download --path=wp-test --version=6.4.5
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain minimum" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=8.9.0 --activate
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin list
          if php wp-cli.phar --path=wp-test plugin is-installed wordpress-seo; then echo "Yoast SEO must not be installed here"; exit 1; fi
      - name: Run the integration suites on the minimum versions
        env:
          VCAP_EXPECT_HPOS: ''
        run: tests/run-integration.sh

  ecosystem:
    # Real third-party plugins from wordpress.org next to Voucher Captain: payment gateways and currency switchers
    # (latest releases; the job prints the installed versions). tests/ecosystem-integration.php
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: stripe
            slug: woocommerce-gateway-stripe
          - key: paypal
            slug: woocommerce-paypal-payments
          - key: woocs
            slug: woocommerce-currency-switcher
          - key: curcy
            slug: woo-multi-currency
          - key: wcml
            slug: woocommerce-multilingual
    name: ecosystem (${{ matrix.key }})
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress, WooCommerce, ${{ matrix.slug }} and the release ZIP
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain ecosystem" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test option update woocommerce_currency EUR
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin install ${{ matrix.slug }} --activate
          php wp-cli.phar --path=wp-test plugin list
      - name: Voucher Captain with ${{ matrix.slug }}
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/ecosystem-integration.php" setup ${{ matrix.key }}
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/ecosystem-integration.php" run ${{ matrix.key }}
          # Both plugins still load without PHP errors on a front-end request.
          php wp-cli.phar --path=wp-test eval 'echo "ok\n";' 2>&1 | tee load.log
          ! grep -E "PHP (Fatal|Warning)" load.log

  license-acceptance:
    # Acceptance against a reachable WP License Captain server with real release packages (TODO "Aktivierung,
    # Feature-Sperren, Offline-Verhalten und Update-Installation …" and "Release-Weg"): the license server
    # (hastla007/wp-license on WordPress + WooCommerce) runs over HTTPS as https://licenses.test (own test CA) with
    # its release storage (premium ZIPs + SHA-256 manifests, tools/license-server/wplc-release-registry.php); a second
    # WordPress site installs the release from that storage and updates through the licence download grant.
    # tests/license-acceptance.php
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SERVER: ${{ github.workspace }}/../license-server
      SHOP: ${{ github.workspace }}/../license-shop
    steps:
      - uses: actions/checkout@v5
      - name: Check out the license server (WP License Captain)
        uses: actions/checkout@v5
        with:
          repository: hastla007/wp-license
          ref: 3300685a524edfc4ed0e1f3119f739c5e989b2d4
          path: wp-license
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, intl, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: HTTPS for licenses.test with a test CA
        run: |
          echo "127.0.0.1 licenses.test" | sudo tee -a /etc/hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq socat
          mkdir -p "$RUNNER_TEMP/tls" && cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Voucher Captain CI test CA" -keyout ca.key -out ca.crt -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -subj "/CN=licenses.test" -keyout server.key -out server.csr
          printf "subjectAltName=DNS:licenses.test\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out server.crt
          cat server.crt server.key > server.pem
      - name: License server on https://licenses.test
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE licenses; CREATE DATABASE shop;"
          php wp-cli.phar core download --path="$SERVER" --version=7.1.4
          printf "\$_SERVER['HTTPS'] = 'on';\n" | php wp-cli.phar config create --path="$SERVER" --dbname=licenses --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --extra-php
          php wp-cli.phar core install --path="$SERVER" --url=https://licenses.test --title="License server" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path="$SERVER" rewrite structure '/%postname%/'
          php wp-cli.phar --path="$SERVER" plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path="$SERVER" option update woocommerce_currency EUR
          # The plugin loads its classes through Composer's autoloader (PSR-4, no third-party packages needed).
          composer dump-autoload --no-dev --working-dir=wp-license --no-interaction
          ln -s "$GITHUB_WORKSPACE/wp-license" "$SERVER/wp-content/plugins/wp-license"
          php wp-cli.phar --path="$SERVER" plugin activate wp-license
          mkdir -p "$SERVER/wp-content/mu-plugins" "$SERVER/wp-content/wplc-releases" "$SERVER/packages"
          cp tools/license-server/wplc-release-registry.php "$SERVER/wp-content/mu-plugins/"
          ( cd "$SERVER" && PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 > "$RUNNER_TEMP/php-server.log" 2>&1 & )
          sudo nohup socat OPENSSL-LISTEN:443,reuseaddr,fork,cert="$RUNNER_TEMP/tls/server.pem",verify=0 TCP:127.0.0.1:8080 > "$RUNNER_TEMP/socat.log" 2>&1 &
          sleep 3
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/tls/ca.crt" https://licenses.test/wp-json/wplc/v1 | head -c 300; echo
      - name: Publish two releases to the licence manager storage (ZIP + SHA-256 manifest)
        run: |
          # release(): premium build of the given sources, stored as voucher-captain-premium-X.Y.Z.zip, manifest made by
          # the licence server's own tool (RELEASE.md step 6).
          release() {
            ( cd "$1" && VCAP_EDITION=premium bin/build.sh )
            version="$(sed -n 's/^ \* Version: *//p' "$1/voucher-captain.php" | tr -d '[:space:]')"
            cp "$1/build/voucher-captain.zip" "$SERVER/packages/voucher-captain-premium-$version.zip"
            printf 'Voucher Captain %s (CI acceptance release).\n' "$version" > "$RUNNER_TEMP/notes-$version.md"
            php wp-license/tools/create-release-manifest.php --zip="$SERVER/packages/voucher-captain-premium-$version.zip" \
              --product-key=voucher-captain --version="$version" \
              --package-url="https://licenses.test/packages/voucher-captain-premium-$version.zip" \
              --requires-php=8.1 --requires-wp=6.4 --tested-wp=7.1 --changelog="$RUNNER_TEMP/notes-$version.md" \
              --output="$SERVER/wp-content/wplc-releases/voucher-captain-$version.json"
            cat "$SERVER/wp-content/wplc-releases/voucher-captain-$version.json"
          }
          release "$GITHUB_WORKSPACE"
          # The next release 99.0.0: the same sources with the version raised, built by the same release script.
          rsync -a --exclude build --exclude wp-license ./ "$RUNNER_TEMP/vc-next/"
          sed -i "s/^ \* Version: .*/ * Version:           99.0.0/; s/^define( 'VCAP_VERSION', '[^']*' );/define( 'VCAP_VERSION', '99.0.0' );/" "$RUNNER_TEMP/vc-next/voucher-captain.php"
          sed -i "s/^Stable tag: .*/Stable tag: 99.0.0/" "$RUNNER_TEMP/vc-next/readme.txt"
          release "$RUNNER_TEMP/vc-next"
      - name: New installation from the licence manager storage (download, SHA-256 against the manifest)
        run: |
          php wp-cli.phar core download --path="$SHOP" --version=7.1.4
          printf "define( 'FS_METHOD', 'direct' );\n" | php wp-cli.phar config create --path="$SHOP" --dbname=shop --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --extra-php
          php wp-cli.phar core install --path="$SHOP" --url=http://shop.test --title="Shop" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path="$SHOP" plugin install woocommerce --version=11.2.2 --activate
          # WordPress verifies HTTPS against its own CA bundle: trust the test CA of licenses.test.
          cat "$RUNNER_TEMP/tls/ca.crt" >> "$SHOP/wp-includes/certificates/ca-bundle.crt"
          version="$(sed -n 's/^ \* Version: *//p' voucher-captain.php | tr -d '[:space:]')"
          manifest="$SERVER/wp-content/wplc-releases/voucher-captain-$version.json"
          url="$(php -r 'echo json_decode(file_get_contents($argv[1]), true)["package_url"];' "$manifest")"
          sha="$(php -r 'echo json_decode(file_get_contents($argv[1]), true)["sha256"];' "$manifest")"
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/tls/ca.crt" -o "$RUNNER_TEMP/download.zip" "$url"
          echo "$sha  $RUNNER_TEMP/download.zip" | sha256sum -c -
          php wp-cli.phar --path="$SHOP" plugin install "$RUNNER_TEMP/download.zip" --activate
          php wp-cli.phar --path="$SHOP" plugin list
      - name: Acceptance – activation, feature gate, offline, suspension, update, deactivation
        run: |
          T="$GITHUB_WORKSPACE/tests/license-acceptance.php"
          server() { php wp-cli.phar --path="$SERVER" eval-file "$T" "$@"; }
          shop() { php wp-cli.phar --path="$SHOP" --user=admin eval-file "$T" "$@"; }
          tls_up() { sudo nohup socat OPENSSL-LISTEN:443,reuseaddr,fork,cert="$RUNNER_TEMP/tls/server.pem",verify=0 TCP:127.0.0.1:8080 >> "$RUNNER_TEMP/socat.log" 2>&1 & sleep 2; }
          server server-setup "$RUNNER_TEMP/license.key"
          server server-releases 99.0.0
          shop shop-locked
          shop shop-activate "$RUNNER_TEMP/license.key"
          shop shop-active
          sudo pkill -f "socat OPENSSL-LISTEN:443" && sleep 1
          shop shop-offline
          tls_up
          server server-status suspended
          shop shop-suspended
          server server-status active
          shop shop-reactivated
          server server-bad-checksum 99.0.0
          shop shop-update-rejected
          server server-good-checksum 99.0.0
          shop shop-update
          shop shop-updated 99.0.0
          shop shop-deactivate
          ! grep -E "PHP (Fatal|Warning)" "$RUNNER_TEMP/php-server.log"
      - name: Server logs
        if: failure()
        run: |
          tail -n 80 "$RUNNER_TEMP/php-server.log" || true
          tail -n 40 "$RUNNER_TEMP/socat.log" || true

  multisite:
    # Network activation sets up every site (own tables and options per site), new sites are set up on their
    # first request, and a network uninstall removes data only on the sites that opted in.
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Multisite network with Voucher Captain network-activated
        run: |
          WP="php wp-cli.phar --path=wp-test"
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          $WP core multisite-install --url=http://localhost --title="Voucher Captain network" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          $WP site create --slug=before --title="Existing site"
          $WP plugin install woocommerce --version=11.2.2 --activate-network
          bin/build.sh
          $WP plugin install build/voucher-captain.zip --activate-network
          $WP site create --slug=after --title="New site"
          check='global $wpdb; $ok = $wpdb->get_var( "SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"" ) && VCAP_DB_VERSION === get_option( "vcap_db_version" ) && get_option( "vcap_secret" ); echo get_current_blog_id(), " ", $wpdb->prefix, " ", $ok ? "ok" : "missing", "\n"; exit( $ok ? 0 : 1 );'
          $WP eval "$check"
          $WP --url=http://localhost/before/ eval "$check"
          $WP --url=http://localhost/after/ eval "$check"
      - name: Network uninstall deletes data only on sites that opted in
        run: |
          WP="php wp-cli.phar --path=wp-test"
          $WP --url=http://localhost/after/ option update vcap_delete_on_uninstall yes
          $WP plugin deactivate voucher-captain --network
          $WP plugin uninstall voucher-captain
          has='global $wpdb; echo $wpdb->get_var( "SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"" ) ? "kept" : "deleted";'
          test "$($WP eval "$has")" = "kept"
          test "$($WP --url=http://localhost/before/ eval "$has")" = "kept"
          test "$($WP --url=http://localhost/after/ eval "$has")" = "deleted"

  pass-captain:
    # Voucher Captain as voucher provider of WP Pass Captain: released main and the current work branch
    # of hastla007/wp-passmaster (a ref that no longer exists is skipped).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pass_captain_ref: ['main', 'claude/youthful-bardeen-7ejd7a']
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress, WooCommerce, WP Pass Captain and the release ZIP
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher + Pass Captain" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          if ! curl --fail --silent --show-error --location --output pass-captain.zip "https://codeload.github.com/hastla007/wp-passmaster/zip/refs/heads/${{ matrix.pass_captain_ref }}"; then
            echo "Pass Captain ref ${{ matrix.pass_captain_ref }} is not available; skipping."
            echo "VCAP_SKIP_PASS_CAPTAIN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          unzip -q pass-captain.zip -d pass-captain-src
          mv pass-captain-src/wp-passmaster-* wp-test/wp-content/plugins/wp-pass-captain
          composer install --working-dir=wp-test/wp-content/plugins/wp-pass-captain --no-dev --no-interaction --prefer-dist
          php wp-cli.phar --path=wp-test plugin activate wp-pass-captain
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin list
      - name: Run the Voucher Captain + Pass Captain checks
        if: env.VCAP_SKIP_PASS_CAPTAIN != '1'
        run: |
          php wp-cli.phar --path=wp-test plugin get wp-pass-captain --field=version
          php bin/check-coexistence.php wp-test/wp-content/plugins/voucher-captain wp-test/wp-content/plugins/wp-pass-captain
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/passcaptain-integration.php"
          # Tax classification incl. what Pass Captain receives in the quote (TAX.md 4.2).
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/tax-integration.php"

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress, WooCommerce, Yoast SEO and the release ZIP
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar --path=wp-test config set WP_DEBUG true --raw
          php wp-cli.phar --path=wp-test config set WP_DEBUG_LOG true --raw
          php wp-cli.phar --path=wp-test config set WP_DEBUG_DISPLAY false --raw
          php wp-cli.phar core install --path=wp-test --url=http://127.0.0.1:8080 --title="Voucher Captain E2E" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test plugin install wordpress-seo --version=28.8 --activate
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test rewrite structure '/%postname%/'
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/setup.php"
          php wp-cli.phar --path=wp-test rewrite flush
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright and axe
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start the web server
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t wp-test tests/e2e/router.php > php-server.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail --output /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl --silent --fail --output /dev/null http://127.0.0.1:8080/product/e2e-voucher/
      - name: Browser tests – product page, customer pages, admin with Yoast SEO
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test 01-product.spec.js 04-account-and-shortcodes.spec.js 05-admin-yoast.spec.js 06-screen-reader.spec.js
      - name: Browser tests – classic cart and checkout
        env:
          CI: 'true'
          E2E_CHECKOUT: classic
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/pages.php" classic
          cd tests/e2e && npx playwright test 02-classic-checkout.spec.js
      - name: Browser tests – cart and checkout blocks
        env:
          CI: 'true'
          E2E_CHECKOUT: blocks
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/pages.php" blocks
          cd tests/e2e && npx playwright test 03-block-checkout.spec.js
      - name: Verify issued vouchers and PHP notices
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/verify.php"
          if [ -f wp-test/wp-content/debug.log ] && grep -i "voucher-captain" wp-test/wp-content/debug.log; then
            echo "Voucher Captain caused PHP notices (see above)."
            exit 1
          fi
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-results
          path: |
            tests/e2e/test-results
            php-server.log
            wp-test/wp-content/debug.log
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Install PHPCS, WordPress Coding Standards, and PHPStan
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 woocommerce/woocommerce-sniffs:^2.0 phpstan/phpstan:^2.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: Check API and contract coding standards
        run: phpcs --standard=WordPress --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Check API and contract WooCommerce coding standards
        run: phpcs --standard=WooCommerce-Core --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Analyze API and contract types
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress
