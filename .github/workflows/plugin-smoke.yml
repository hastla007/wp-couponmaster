          php wp-cli.phar --path=wp-test plugin list
      - name: Plugin Check (static and runtime checks)
        run: |
          set +e
          php wp-cli.phar --path=wp-test plugin check voucher-captain --format=csv \
            --require="$GITHUB_WORKSPACE/wp-test/wp-content/plugins/plugin-check/cli.php" > plugin-check.csv
          status=$?
          cat plugin-check.csv
          {
            echo '### Plugin Check (report-only)'
            echo "Errors: $(grep -c ',ERROR,' plugin-check.csv || true), warnings: $(grep -c ',WARNING,' plugin-check.csv || true)"
