name: Plugin smoke tests

on:
  push:
    branches:
      - main
      - claude/youthful-bardeen-7ejd7a
      - codex/fix-voucher-audit-findings
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, gd, mbstring, xml, zip
          coverage: none
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Lint PHP files
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run plugin smoke tests
        run: php tests/run.php

  wordpress-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping --host=127.0.0.1 --user=root --password=root
          - name: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: healthcheck.sh --connect --innodb_initialized
        order_storage:
          - name: HPOS
            enabled: 'yes'
            expected: 'yes'
          - name: Legacy posts
            enabled: 'no'
            expected: 'no'
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health_cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress 7.1.4
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain CI" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
      - name: Build, install, and update the release ZIP
        run: |
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test plugin install wordpress-seo --version=28.8 --activate
          php wp-cli.phar --path=wp-test option update woocommerce_custom_orders_table_enabled ${{ matrix.order_storage.enabled }}
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --force
      - name: Run WooCommerce lifecycle and database integration checks
        env:
          VCAP_EXPECT_HPOS: ${{ matrix.order_storage.expected }}
        run: |
          VCAP_WITH_COMPAT=1 tests/run-integration.sh
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" setup
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" reserve 0 & first=$!
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" reserve 1 & second=$!
          wait "$first"
          wait "$second"
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/parallel-checkout.php" verify
      - name: Verify uninstall preserves data by default and deletes only when opted in
        run: |
          php wp-cli.phar --path=wp-test option update vcap_delete_on_uninstall no
          php wp-cli.phar --path=wp-test plugin deactivate voucher-captain
          php wp-cli.phar --path=wp-test plugin uninstall voucher-captain
          php wp-cli.phar --path=wp-test eval 'global $wpdb; if (!$wpdb->get_var("SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"")) { exit(1); }'
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test option update vcap_delete_on_uninstall yes
          php wp-cli.phar --path=wp-test plugin deactivate voucher-captain
          php wp-cli.phar --path=wp-test plugin uninstall voucher-captain
          php wp-cli.phar --path=wp-test eval 'global $wpdb; if ($wpdb->get_var("SHOW TABLES LIKE \"{$wpdb->prefix}vcap_vouchers\"")) { exit(1); }'

  minimum-versions:
    # Oldest supported platform (plugin header) without Yoast SEO: WordPress 6.4, WooCommerce 8.9, PHP 8.1.
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress 6.4, WooCommerce 8.9 and the release ZIP (no Yoast SEO)
        run: |
          php wp-cli.phar core download --path=wp-test --version=6.4.5
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain minimum" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=8.9.0 --activate
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin list
          if php wp-cli.phar --path=wp-test plugin is-installed wordpress-seo; then echo "Yoast SEO must not be installed here"; exit 1; fi
      - name: Run the integration suites on the minimum versions
        env:
          VCAP_EXPECT_HPOS: ''
        run: tests/run-integration.sh

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress, WooCommerce, Yoast SEO and the release ZIP
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar --path=wp-test config set WP_DEBUG true --raw
          php wp-cli.phar --path=wp-test config set WP_DEBUG_LOG true --raw
          php wp-cli.phar --path=wp-test config set WP_DEBUG_DISPLAY false --raw
          php wp-cli.phar core install --path=wp-test --url=http://127.0.0.1:8080 --title="Voucher Captain E2E" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test plugin install wordpress-seo --version=28.8 --activate
          bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test rewrite structure '/%postname%/'
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/setup.php"
          php wp-cli.phar --path=wp-test rewrite flush
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and axe
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start the web server
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t wp-test tests/e2e/router.php > php-server.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail --output /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl --silent --fail --output /dev/null http://127.0.0.1:8080/product/e2e-voucher/
      - name: Browser tests – product page, customer pages, admin with Yoast SEO
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test 01-product.spec.js 04-account-and-shortcodes.spec.js 05-admin-yoast.spec.js
      - name: Browser tests – classic cart and checkout
        env:
          CI: 'true'
          E2E_CHECKOUT: classic
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/pages.php" classic
          cd tests/e2e && npx playwright test 02-classic-checkout.spec.js
      - name: Browser tests – cart and checkout blocks
        env:
          CI: 'true'
          E2E_CHECKOUT: blocks
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/pages.php" blocks
          cd tests/e2e && npx playwright test 03-block-checkout.spec.js
      - name: Verify issued vouchers and PHP notices
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/verify.php"
          if [ -f wp-test/wp-content/debug.log ] && grep -i "voucher-captain" wp-test/wp-content/debug.log; then
            echo "Voucher Captain caused PHP notices (see above)."
            exit 1
          fi
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            tests/e2e/test-results
            php-server.log
            wp-test/wp-content/debug.log
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Install PHPCS, WordPress Coding Standards, and PHPStan
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 woocommerce/woocommerce-sniffs:^2.0 phpstan/phpstan:^2.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: Check API and contract coding standards
        run: phpcs --standard=WordPress --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Check API and contract WooCommerce coding standards
        run: phpcs --standard=WooCommerce-Core --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Analyze API and contract types
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress
