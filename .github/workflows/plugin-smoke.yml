          cd tests/e2e && npx playwright test 02-classic-checkout.spec.js
      - name: Browser tests – cart and checkout blocks
        env:
          CI: 'true'
          E2E_CHECKOUT: blocks
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/pages.php" blocks
          cd tests/e2e && npx playwright test 03-block-checkout.spec.js
      - name: Verify issued vouchers and PHP notices
        run: |
          php wp-cli.phar --path=wp-test eval-file "$GITHUB_WORKSPACE/tests/e2e/verify.php"
          if [ -f wp-test/wp-content/debug.log ] && grep -i "voucher-captain" wp-test/wp-content/debug.log; then
            echo "Voucher Captain caused PHP notices (see above)."
            exit 1
          fi
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-results
          path: |
            tests/e2e/test-results
            php-server.log
            wp-test/wp-content/debug.log
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Install PHPCS, WordPress Coding Standards, and PHPStan
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 woocommerce/woocommerce-sniffs:^2.0 phpstan/phpstan:^2.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: Check API and contract coding standards
        run: phpcs --standard=WordPress --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Check API and contract WooCommerce coding standards
        run: phpcs --standard=WooCommerce-Core --extensions=php --exclude=WordPress.Files.FileName src/API/V1 src/Contracts
      - name: Analyze API and contract types
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress
      - name: Release ZIPs (free and premium edition, as shipped) carry a licence file for every bundled package, the notices and an SBOM
        run: |
          for edition in free premium; do
            VCAP_EDITION="$edition" bin/build.sh
            php bin/third-party-notices.php --check-zip build/voucher-captain.zip
            php bin/sbom.php build/voucher-captain "sbom-${edition}.cdx.json"
          done

  quality-wide:
    # Wide scan of the whole plugin (src/, templates/, config/, main and uninstall file): PHPCS with phpcs.xml.dist
    # (WordPress-Extra, I18n text domain, Security) and PHPStan level 1 with phpstan-wide.neon.dist + baseline
    # (RELEASE.md → Static analysis). Blocking are: every WordPress.Security.* finding, and a growth of the PHPCS or
    # PHPStan findings against the base commit (ratchet: pull request base, or the previous commit of a push). The
    # full reports stay informational until the existing findings are worked off.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install PHPCS, WordPress Coding Standards, and PHPStan
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.0 phpstan/phpstan:^2.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: WordPress.Security sniffs on the whole plugin (blocking)
        run: |
          # Escaping, nonces, sanitising, safe redirects: no finding may reach a release. A justified exception gets an
          # inline "phpcs:ignore WordPress.Security.<Sniff> -- reason" next to the code.
          phpcs --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.PluginMenuSlug,WordPress.Security.SafeRedirect,WordPress.Security.ValidatedSanitizedInput --report-full --report-summary
      - name: PHPCS (WordPress-Extra, I18n, Security) on the whole plugin (report)
        run: |
          phpcs --report-full=phpcs-full.txt --report-summary=phpcs-summary.txt --report-source=phpcs-source.txt --report-json=phpcs.json || true
          { echo '### PHPCS (wide scan)'; echo '```'; cat phpcs-source.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test -s phpcs.json
      - name: PHPStan level 1 on the whole plugin (findings beyond phpstan-baseline.neon, report)
        run: |
          phpstan analyse --configuration=phpstan-wide.neon.dist --no-progress --memory-limit=1G --error-format=json > phpstan.json || true
          phpstan analyse --configuration=phpstan-wide.neon.dist --no-progress --memory-limit=1G || true
          test -s phpstan.json
      - name: Findings must not grow (ratchet against the base commit)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          count_phpcs() { php -r '$d = json_decode( file_get_contents( $argv[1] ), true ); echo (int) ( $d["totals"]["errors"] ?? -1 ) + (int) ( $d["totals"]["warnings"] ?? 0 );' "$1"; }
          count_phpstan() { php -r '$d = json_decode( file_get_contents( $argv[1] ), true ); echo (int) ( $d["totals"]["errors"] ?? -1 ) + (int) ( $d["totals"]["file_errors"] ?? 0 );' "$1"; }
          head_cs="$(count_phpcs phpcs.json)"
          head_stan="$(count_phpstan phpstan.json)"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then echo "::warning::No base commit – ratchet skipped."; exit 0; fi
          git worktree add --quiet "$RUNNER_TEMP/base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/vendor" "$RUNNER_TEMP/base/vendor"
          base_cs=""; base_stan=""
          if [ -f "$RUNNER_TEMP/base/phpcs.xml.dist" ]; then
            ( cd "$RUNNER_TEMP/base" && phpcs --report-json="$RUNNER_TEMP/base-phpcs.json" -q > /dev/null || true )
            base_cs="$(count_phpcs "$RUNNER_TEMP/base-phpcs.json")"
          fi
          if [ -f "$RUNNER_TEMP/base/phpstan-wide.neon.dist" ]; then
            ( cd "$RUNNER_TEMP/base" && phpstan analyse --configuration=phpstan-wide.neon.dist --no-progress --memory-limit=1G --error-format=json > "$RUNNER_TEMP/base-phpstan.json" || true )
            base_stan="$(count_phpstan "$RUNNER_TEMP/base-phpstan.json")"
          fi
          {
            echo '### Findings ratchet'
            echo "| Scan | base ${BASE:0:7} | this commit |"
            echo '| --- | --- | --- |'
            echo "| PHPCS (errors + warnings) | ${base_cs:-n/a} | ${head_cs} |"
            echo "| PHPStan level 1 (beyond the baseline) | ${base_stan:-n/a} | ${head_stan} |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$head_cs" -lt 0 ] || [ "$head_stan" -lt 0 ]; then echo "::error::A scan of this commit produced no report."; fail=1; fi
          if [ -n "$base_cs" ] && [ "$base_cs" -ge 0 ] && [ "$head_cs" -gt "$base_cs" ]; then
            echo "::error::PHPCS findings grew from ${base_cs} to ${head_cs} (see phpcs-full.txt in the artifact phpstan-baseline). Fix the new findings."
            fail=1
          fi
          if [ -n "$base_stan" ] && [ "$base_stan" -ge 0 ] && [ "$head_stan" -gt "$base_stan" ]; then
            echo "::error::PHPStan findings grew from ${base_stan} to ${head_stan}. Fix them – never add baseline entries for new code."
            fail=1
          fi
          echo "PHPCS ${base_cs:-n/a} -> ${head_cs}, PHPStan ${base_stan:-n/a} -> ${head_stan}"
          exit $fail
      - name: Generate a PHPStan baseline of the current findings
        if: always()
        run: phpstan analyse --configuration=phpstan-wide.neon.dist --no-progress --memory-limit=1G --generate-baseline=phpstan-baseline.generated.neon --allow-empty-baseline || true
      - name: Upload the reports and the generated baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phpstan-baseline
          path: |
            phpcs-*.txt
            phpcs.json
            phpstan.json
            phpstan-baseline.generated.neon
          if-no-files-found: ignore

  plugin-check:
    # WordPress Plugin Check (PCP, the wordpress.org review tool) against the installed release ZIP of each edition as
    # shipped (free, premium). Report-only for now (RELEASE.md → Static analysis); the result table is in the job
    # summary and the artifact plugin-check-<edition>.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        edition: [free, premium]
    name: plugin-check (${{ matrix.edition }})
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, mbstring, mysqli, xml, zip
          coverage: none
      - name: Download WP-CLI
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output wp-cli.phar
      - name: Install WordPress, WooCommerce, Plugin Check and the release ZIP
        run: |
          php wp-cli.phar core download --path=wp-test --version=7.1.4
          php wp-cli.phar config create --path=wp-test --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          php wp-cli.phar core install --path=wp-test --url=http://localhost --title="Voucher Captain plugin check" --admin_user=admin --admin_password=ci-password --admin_email=ci@example.test
          php wp-cli.phar --path=wp-test plugin install woocommerce --version=11.2.2 --activate
          php wp-cli.phar --path=wp-test plugin install plugin-check --activate
          VCAP_EDITION=${{ matrix.edition }} bin/build.sh
          php wp-cli.phar --path=wp-test plugin install build/voucher-captain.zip --activate
          php wp-cli.phar --path=wp-test plugin list
      - name: Plugin Check (static and runtime checks)
        run: |
          set +e
          php wp-cli.phar --path=wp-test plugin check voucher-captain --format=csv \
            --require="$GITHUB_WORKSPACE/wp-test/wp-content/plugins/plugin-check/cli.php" > plugin-check.csv
          status=$?
          cat plugin-check.csv
          {
            echo '### Plugin Check – ${{ matrix.edition }} edition (report-only)'
            echo "Errors: $(grep -c ',ERROR,' plugin-check.csv || true), warnings: $(grep -c ',WARNING,' plugin-check.csv || true)"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q ',ERROR,' plugin-check.csv; then exit 1; fi
          exit $status
      - name: Upload the Plugin Check result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-check-${{ matrix.edition }}
          path: plugin-check.csv
          if-no-files-found: ignore
